name: Проверки PR

# Тесты (включая карту систем и инварианты tests/systems.test.ts), шаблоны и сборка — на каждом PR, до слияния.
# Выкладка на сайт — отдельно, pages.yml (после слияния в основную ветку).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:templates
      - run: npm run build
