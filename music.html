<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Музыка (проверка)</title>
<style>
  body{margin:0;background:#1b1446;color:#fff;font:15px/1.4 system-ui,sans-serif;padding:20px}
  h1{font-size:18px;margin:0 0 4px} p{margin:0 0 16px;opacity:.75}
  #app{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;max-width:820px}
  button{background:#2b2270;color:#fff;border:2px solid #4b3fb0;border-radius:12px;padding:12px;text-align:left;cursor:pointer;font:inherit}
  button b{display:block} button small{display:block;opacity:.7;margin-top:2px}
  button.on{border-color:#ffd166;background:#3a2f95} button:disabled{opacity:.5}
  .row{max-width:820px;margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  input[type=range]{width:220px} select{font:inherit;padding:6px;border-radius:8px}
  #rec{text-align:center}
</style></head><body>
<h1>Музыка «Разлома» (проверка)</h1>
<p>Нажмите настроение: звук включится после первого нажатия. Громкость музыки общая с настройками игры.</p>
<div id="app"></div>
<div class="row"><label>Музыка <input id="vol" type="range" min="0" max="1" step="0.05"> <span id="volv"></span></label>
<label>Фокус: <select id="focus"><option value="off">выключено</option><option value="quiet">тихо</option></select></label>
<button id="rec">Записать 30 с в WAV</button><span id="msg"></span></div>
<script type="module" src="/src/dev/music.ts"></script></body></html>
